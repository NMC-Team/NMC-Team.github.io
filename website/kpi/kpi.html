<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NMC KPI Ranking</title>

    <script>
        document.documentElement.classList.add("dark");
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class"
        };
    </script>

    <style>

        :root {
            --bg-color: #0b0f19;

            --glow1: rgba(139, 92, 246, .16);
            --glow2: rgba(124, 58, 237, .10);

            --accent: #8b5cf6;
            --accent-2: #7c3aed;

            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --panel-border: #1f2937;

            --header-grad-from: #0b0f19;
            --header-grad-via: rgba(17, 24, 39, .95);
            --header-grad-to: rgba(31, 41, 55, .75);

            --header-border: rgba(55, 65, 81, .55);

            --input-bg:
                linear-gradient(
                    to top right,
                    #FFF7FB 0%,
                    #FFF9FC 45%,
                    #FFFFFF 100%
                );

            --input-border: #374151;

            --pill-bg: #111827;
            --pill-border: #1f2937;
        }

        * {
            scrollbar-width: thin;
            box-sizing: border-box;
        }

        html {
            overflow-y: auto;
        }

        body {
            font-family: Inter, system-ui, sans-serif;

            background-color: var(--bg-color);

            color: var(--text-primary);

            background-image:
                radial-gradient(
                    circle at 50% 0%,
                    var(--glow1) 0%,
                    transparent 60%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    var(--glow2) 0%,
                    transparent 40%
                );

            background-size: 100% 100%, 100% 100%;
        }

        .rainbow-title {
            color: var(--text-primary);
        }

        .single-rainbow-border {
            position: relative;
            border-radius: .75rem;
            padding: 0;
            background: transparent;
        }

        .single-rainbow-border::before {
            display: none;
        }

        .top1-name {

            color: #ff4d4d;

            font-weight: 800;
        }

        .top2-name {

            color: #d97706;

            font-weight: 700;
        }

        .top3-name {

            color: #9333ea;

            font-weight: 700;
        }

        .top4-name {

            color: #2563eb;

            font-weight: 700;
        }

        .special-player-name {
            color: var(--accent);
            font-weight: 800;
        }

        .table-container-cq {

            container-type: inline-size;

            container-name: nmc-table;
        }

        .grid-layout {

            display: grid;

            grid-template-columns:
                minmax(46px,.8fr)
                minmax(34px,.5fr)
                minmax(0,2.8fr)
                minmax(0,1.7fr)
                minmax(0,2.2fr)
                minmax(0,2.0fr);

            align-items: center;

            width: 100%;

            gap: 8px;
        }

        .grid-layout > div {

            min-width: 0;

            overflow: hidden;
        }

        .grid-layout .sort-btn {

            max-width: 100%;

            overflow: hidden;

            white-space: nowrap;
        }

        #tableHeader {

            font-size: 9px;

            padding: 10px;
        }

        .data-row {

            font-size: 11px;

            padding: 9px;
        }

        .id-text {

            font-size: 9px;
        }

        .rank-badge-text {

            font-size: 9px;
        }

        .percent-text {

            font-size: 9px;
        }

        @container nmc-table (max-width: 700px) {

            .grid-layout {

                grid-template-columns:
                    minmax(40px,.8fr)
                    minmax(28px,.5fr)
                    minmax(0,2.3fr)
                    minmax(0,1.6fr)
                    minmax(0,1.7fr)
                    minmax(0,1.7fr);

                gap: 5px;
            }

            #tableHeader {

                font-size: 7.5px;

                padding: 6px;
            }

            .data-row {

                font-size: 9px;

                padding: 6px;
            }

            .id-text,
            .rank-badge-text,
            .percent-text {

                font-size: 7.5px;
            }
        }

        @container nmc-table (max-width: 480px) {

            .grid-layout {

                grid-template-columns:
                    minmax(34px,.8fr)
                    minmax(24px,.5fr)
                    minmax(0,2fr)
                    minmax(0,1.4fr)
                    minmax(0,1.5fr)
                    minmax(0,1.5fr);

                gap: 3px;
            }

            #tableHeader {

                font-size: 6.5px;

                padding: 5px;
            }

            .data-row {

                font-size: 8px;

                padding: 5px;
            }

            .id-text,
            .rank-badge-text,
            .percent-text {

                font-size: 6.5px;
            }
        }

        .sort-btn {

            background: none;

            border: none;

            color: inherit;

            font: inherit;

            cursor: pointer;

            padding: 0;

            display: inline-flex;

            align-items: center;

            gap: 2px;
        }

        .sort-btn:hover {

            color: var(--accent);
        }

        .sort-arrow {

            font-size: .65rem;

            opacity: .3;

            transition:
                transform .2s,
                color .2s;
        }

        .sort-btn.active .sort-arrow {

            opacity: 1;

            color: var(--accent);

            font-weight: bold;
        }

        .progress-track {

            background: #27272a;

            height: 6px;

            border-radius: 999px;

            overflow: hidden;
        }

        .progress-fill {

            height: 100%;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #7e22ce 0%,
                    #a855f7 45%,
                    #22c55e 100%
                );

            transition:
                width .45s ease;
        }


        .progress-kpi-row {
            display: grid;
            grid-template-columns: 42px 80px 58px;
            align-items: center;
            justify-content: end;
            column-gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .progress-kpi-row .percent-text {
            width: 42px;
            text-align: right;
            white-space: nowrap;
        }

        .progress-kpi-row .progress-track {
            width: 80px;
            min-width: 80px;
        }

        .progress-kpi-row .kpi-value {
            width: 58px;
            text-align: right;
            white-space: nowrap;
        }

        .kpi-status {

            min-width: 240px;
        }

        .status-title {

            font-size: 9px;

            font-weight: 800;

            color: var(--text-secondary);

            letter-spacing: .08em;
        }

        .status-row {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 7px;
        }

        .status-label {

            width: 68px;

            flex-shrink: 0;

            font-size: 9px;

            font-weight: 700;

            white-space: nowrap;
        }

        .status-label.good {

            color: #22c55e;
        }

        .status-label.bad {

            color: #ef4444;
        }

        .status-bar {

            flex: 1;

            height: 7px;

            background: #27272a;

            border-radius: 999px;

            overflow: hidden;
        }

        .status-fill {

            height: 100%;

            width: 0%;

            border-radius: 999px;

            transition:
                width .5s ease;
        }

        .status-fill.good {

            background:
                linear-gradient(
                    90deg,
                    #15803d,
                    #22c55e
                );
        }

        .status-fill.bad {

            background:
                linear-gradient(
                    90deg,
                    #991b1b,
                    #ef4444
                );
        }

        .status-count {

            width: 40px;

            text-align: right;

            font-size: 9px;

            font-family: monospace;

            font-weight: 800;
        }

        .status-count.good {

            color: #22c55e;
        }

        .status-count.bad {

            color: #ef4444;
        }

        .kpi-good {
            color: #22c55e;
        }

        .kpi-bad {
            color: #ef4444;
        }

        .glow-row {
            position: relative;
            overflow: hidden;
            border-left: 0 solid transparent;
            z-index: 1;
            background: transparent !important;
        }

        .row-border {

            border-bottom:
                1px solid var(--panel-border);
        }

        .theme-panel {

            background: transparent !important;

            border-color:
                rgba(55,65,81,.55) !important;
        }

        .theme-header-banner {

            background:
                linear-gradient(
                    to right,
                    var(--header-grad-from),
                    var(--header-grad-via),
                    var(--header-grad-to)
                );

            border-color:
                var(--header-border) !important;
        }

        .theme-pill {

            background:
                var(--pill-bg) !important;

            border-color:
                var(--pill-border) !important;
        }

        .theme-input {

            background:
                var(--input-bg) !important;

            border-color:
                var(--input-border) !important;

            color:
                #18181b !important;
        }

        .theme-text-primary {

            color:
                var(--text-primary) !important;
        }

        .theme-text-secondary {

            color:
                var(--text-secondary) !important;
        }

        .theme-text-muted {

            color:
                var(--text-muted) !important;
        }

        .theme-accent-text {

            color:
                var(--accent) !important;
        }

        .theme-table-body-bg {

            background:
                transparent !important;
        }

        .theme-search-inner {

            background:
                var(--input-bg) !important;
        }

        .sticky-header {

            position: sticky;

            top: 0;

            z-index: 50;
        }

        .sticky-header.is-stuck {

            border-radius: 0 !important;
        }

        #tableHeader {

            background:
                rgba(88,28,135,.45) !important;

            border-color:
                rgba(55,65,81,.55) !important;

            box-shadow:
                none !important;
        }

        #tableHeader .sort-btn {

            color: inherit !important;
        }

        #tableHeader .sort-btn:hover,
        #tableHeader .sort-btn.active {

            color:
                var(--accent) !important;
        }

    
        /* final visual overrides */
        body {
            background-image: none !important;
            text-shadow: none !important;
        }

        .rainbow-title {
            color: var(--text-primary) !important;
            background: none !important;
            -webkit-background-clip: initial !important;
            background-clip: initial !important;
            -webkit-text-fill-color: currentColor !important;
            animation: none !important;
            text-shadow: none !important;
        }

        .single-rainbow-border::before {
            display: none !important;
            animation: none !important;
        }

        .theme-header-banner {
            background: #111827 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .theme-panel,
        .theme-pill {
            box-shadow: none !important;
        }

        .top1-name,
        .top2-name,
        .top3-name,
        .top4-name,
        .special-player-name {
            text-shadow: none !important;
        }

        /* Disable hover outside DATA DATE and TABLE. */
        #exportCsvBtn:hover,
        #searchInput:hover,
        #members:hover,
        #totalContribution:hover,
        #headerWrapper:hover,
        #dateControls > div:hover {
            filter: none !important;
            transform: none !important;
        }

        /* DATA DATE keeps its existing interaction. */
        .date-item:hover,
        .date-item.active-date {
            background-color: var(--accent) !important;
            color: #fff !important;
        }

        /* TABLE keeps its existing interaction. */
        .sort-btn:hover,
        #tableHeader .sort-btn:hover,
        #tableHeader .sort-btn.active {
            color: var(--accent) !important;
        }

        .glow-row:hover,
        .glow-row.touch-active {
            background-color: #1f2937 !important;
        }

        /* Keep KPI STATUS visuals, but remove decorative glow. */
        .kpi-status,
        .status-row,
        .status-bar,
        .status-fill {
            box-shadow: none !important;
            text-shadow: none !important;
        }


        .theme-panel,
        .theme-pill,
        .theme-input,
        .theme-header-banner,
        #tableHeader,
        .row-border {
            border-width: 1px !important;
            border-style: solid !important;
            border-color: rgba(73, 71, 71, 0.72) !important;
        }

        .row-border {
            border-top: 0 !important;
            border-left: 0 !important;
            border-right: 0 !important;
            border-bottom: 1px solid rgba(73, 71, 71, 0.72) !important;
        }

        #tableHeader {
            border-bottom: 1px solid rgba(73, 71, 71, 0.72) !important;
        }

        #searchInput {
            border: 1px solid rgba(73, 71, 71, 0.72) !important;
        }

        /* exact target palette */
        :root {
            --bg-color: #0b0f19;
            --accent: #8b5cf6;
            --accent-2: #7c3aed;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --panel-border: #494747;
            --header-border: #494747;
            --input-border: #494747;
            --pill-border: #494747;
            --pill-bg: #111827;
            --input-bg: #111827;
        }

        body {
            background: #0b0f19 !important;
            background-image: none !important;
        }

        .theme-header-banner {
            background: #111827 !important;
            border-color: #494747 !important;
        }

        .theme-panel,
        .theme-pill,
        .theme-input,
        .theme-search-inner {
            background: #111827 !important;
            border-color: #494747 !important;
        }

        .theme-input {
            color: #9ca3af !important;
        }

        #tableContainer {
            background: #111827 !important;
            border-color: #494747 !important;
        }

        #tableHeader {
            background: #161e2e !important;
            border-color: #494747 !important;
        }

        .theme-table-body-bg,
        #tableBody {
            background: #111827 !important;
        }

        .row-border {
            border-bottom-color: #494747 !important;
        }

        .progress-track,
        .status-bar {
            background: #1f2937 !important;
        }

        .sort-btn,
        .theme-text-primary {
            color: #f9fafb !important;
        }

        .theme-text-secondary {
            color: #9ca3af !important;
        }

        .theme-text-muted {
            color: #6b7280 !important;
        }

        .theme-accent-text {
            color: #8b5cf6 !important;
        }
</style>

</head>

<body class="min-h-screen pb-10">

    <div class="max-w-[120rem] mx-auto px-3 sm:px-6 lg:px-10">

        <div
            id="headerWrapper"
            class="mt-6 rounded-2xl theme-header-banner border backdrop-blur-md shadow-xl"
        >

            <div
                class="
                    px-6
                    sm:px-8
                    py-6
                    flex
                    flex-col
                    lg:flex-row
                    justify-between
                    items-center
                    text-center
                    lg:text-left
                    gap-6
                "
            >

                <div>

                    <h1
                        class="
                            text-4xl
                            font-black
                            tracking-wider
                            uppercase
                            rainbow-title
                        "
                    >
                        No Mercy
                    </h1>

                    <div
                        class="
                            theme-accent-text
                            font-medium
                            tracking-wide
                            mt-1
                        "
                    >
                        Member KPI 
                    </div>

                </div>

                <div
                    class="
                        theme-pill
                        border
                        rounded-xl
                        px-4
                        py-3
                        shadow-inner
                        kpi-status
                    "
                >

                    <div class="status-title">
                        KPI STATUS <span class="theme-accent-text">(15%)</span>
                    </div>

                    <div class="status-row">

                        <div class="status-label good">
                            KPI Achieved
                        </div>

                        <div class="status-bar">

                            <div
                                id="goodStatusBar"
                                class="status-fill good"
                            ></div>

                        </div>

                        <div
                            id="goodStatusCount"
                            class="status-count good"
                        >
                            0 / 0
                        </div>

                    </div>

                    <div class="status-row">

                        <div class="status-label bad">
                            Not Achieved
                        </div>

                        <div class="status-bar">

                            <div
                                id="badStatusBar"
                                class="status-fill bad"
                            ></div>

                        </div>

                        <div
                            id="badStatusCount"
                            class="status-count bad"
                        >
                            0 / 0
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div
            class="
                mt-6
                flex
                flex-row
                justify-between
                items-center
                gap-2
                sm:gap-4
            "
        >

            <div
                class="
                    single-rainbow-border
                    w-full
                    sm:w-80
                    flex-none
                "
            >

                <div
                    class="
                        relative
                        theme-search-inner
                        rounded-[10px]
                        z-10
                        w-full
                        flex
                        items-center
                    "
                >

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Name or ID..."
                        oninput="handleSearch()"
                        class="
                            w-full
                            bg-transparent
                            rounded-lg
                            py-1.5
                            pl-8
                            pr-3
                            text-xs
                            sm:text-sm
                            theme-text-primary
                            focus:outline-none
                        "
                    >

                    <svg
                        class="
                            w-3.5
                            h-3.5
                            absolute
                            left-2.5
                            top-2
                            theme-text-muted
                            pointer-events-none
                        "
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                        ></path>

                    </svg>

                </div>

            </div>

            <div
                class="
                    flex
                    items-center
                    gap-1.5
                    sm:gap-3
                    shrink-0
                "
            >

                <div
                    class="
                        theme-pill
                        border
                        rounded-lg
                        sm:rounded-xl
                        px-2.5
                        sm:px-4
                        py-1.5
                        sm:py-2
                        shadow-inner
                        text-center
                        min-w-[54px]
                        sm:min-w-[80px]
                    "
                >

                    <div
                        class="
                            text-[8px]
                            sm:text-[10px]
                            theme-text-secondary
                            font-bold
                            whitespace-nowrap
                        "
                    >
                        MEMBERS
                    </div>

                    <div
                        id="members"
                        class="
                            text-sm
                            sm:text-lg
                            font-extrabold
                            theme-accent-text
                            mt-0.5
                        "
                    >
                        0
                    </div>

                </div>

                <div
                    class="
                        theme-pill
                        border
                        rounded-lg
                        sm:rounded-xl
                        px-2.5
                        sm:px-4
                        py-1.5
                        sm:py-2
                        shadow-inner
                        text-center
                        min-w-[90px]
                        sm:min-w-[120px]
                    "
                >

                    <div
                        class="
                            text-[8px]
                            sm:text-[10px]
                            theme-text-secondary
                            font-bold
                            whitespace-nowrap
                        "
                    >
                        DATA DATE
                    </div>

                    <div
                        id="latestDate"
                        class="
                            text-xs
                            sm:text-sm
                            font-extrabold
                            theme-accent-text
                            mt-0.5
                        "
                    >
                        --
                    </div>

                </div>

                <button
                    type="button"
                    id="exportCsvBtn"
                    onclick="exportCSV()"
                    class="theme-pill border rounded-lg sm:rounded-xl px-3 sm:px-4 py-2 shadow-inner text-xs sm:text-sm font-semibold theme-text-secondary whitespace-nowrap"
                >
                    Export CSV
                </button>

            </div>

        </div>

        <div class="mt-4">

            <div
                id="sticky-sentinel"
            ></div>

            <div
                class="
                    rounded-2xl
                    theme-panel
                    border
                    shadow-xl
                    table-container-cq
                "
            >

                <div
                    id="tableHeader"
                    class="
                        grid-layout
                        border-b
                        uppercase
                        rounded-t-2xl
                        sticky-header
                    "
                >

                    <div
                        class="
                            text-left
                            font-semibold
                            truncate
                        "
                    >
                        ID
                    </div>

                    <div class="text-center">

                        <button
                            id="btn-rank"
                            class="
                                sort-btn
                                font-semibold
                                mx-auto
                                active
                            "
                            onclick="sortData('rank')"
                        >
                            RANK

                            <span
                                id="arrow-rank"
                                class="sort-arrow"
                            >
                                ▼
                            </span>

                        </button>

                    </div>

                    <div
                        class="
                            text-left
                            font-semibold
                            pl-3
                            truncate
                        "
                    >
                        PLAYER
                    </div>

                    <div
                        class="
                            text-right
                            font-semibold
                            truncate
                        "
                    >
                        POWER
                    </div>

                    <div class="text-right">

                        <button
                            id="btn-merits"
                            class="sort-btn font-semibold ml-auto"
                            onclick="sortData('merits')"
                        >
                            MERITS

                            <span
                                id="arrow-merits"
                                class="sort-arrow"
                            >
                                ▼
                            </span>

                        </button>

                    </div>

                    <div class="text-right">

                        <button
                            id="btn-progress"
                            class="sort-btn font-semibold ml-auto"
                            onclick="sortData('progress')"
                        >
                            PROGRESS / KPI

                            <span
                                id="arrow-progress"
                                class="sort-arrow"
                            >
                                ▼
                            </span>

                        </button>

                    </div>

                </div>

                <div
                    class="
                        overflow-hidden
                        rounded-b-2xl
                        theme-table-body-bg
                    "
                >

                    <div id="tableBody">

                        <div
                            class="
                                p-8
                                text-center
                                theme-text-muted
                            "
                        >
                            Loading data...
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        let availableDates = [];

        let rawDateMap = {};

        let allDailyData = {};

        let players = [];

        let filteredPlayers = [];

        let currentSortType = "rank";

        let sortDirection = 1;

        let selectedLatestDate = "";

        let activeTouchRow = null;


        function normalizeDate(dStr) {

            if (!dStr) {
                return "";
            }

            dStr = String(dStr)
                .replace(/\.json$/i, "")
                .trim();

            if (dStr.includes("/")) {

                const parts = dStr.split("/");

                if (parts.length === 3) {

                    return (
                        `${parts[0].padStart(2, "0")}-` +
                        `${parts[1].padStart(2, "0")}-` +
                        `${parts[2]}`
                    );

                }

            }

            if (dStr.includes("-")) {

                const parts = dStr.split("-");

                if (parts.length === 3) {

                    if (parts[0].length === 4) {

                        return (
                            `${parts[2].padStart(2, "0")}-` +
                            `${parts[1].padStart(2, "0")}-` +
                            `${parts[0]}`
                        );

                    }

                    return (
                        `${parts[0].padStart(2, "0")}-` +
                        `${parts[1].padStart(2, "0")}-` +
                        `${parts[2]}`
                    );

                }

            }

            return dStr;
        }


        function dateToObject(date) {

            const [
                day,
                month,
                year
            ] = date.split("-").map(Number);

            return new Date(
                year,
                month - 1,
                day
            );
        }


        function formatNumber(value) {

            return Number(value || 0)
                .toLocaleString("en-US");
        }


        function formatPower(value) {

            value = Number(value || 0);

            if (value >= 1000000000) {

                return (
                    (value / 1000000000)
                    .toFixed(2)
                    .replace(/\.00$/, "") +
                    "B"
                );

            }

            if (value >= 1000000) {

                return (
                    (value / 1000000)
                    .toFixed(2)
                    .replace(/\.00$/, "") +
                    "M"
                );

            }

            if (value >= 1000) {

                return (
                    (value / 1000)
                    .toFixed(1)
                    .replace(/\.0$/, "") +
                    "K"
                );

            }

            return formatNumber(value);
        }


        function formatKPI(value) {

            return formatPower(value);
        }


        function normalizePlayer(raw) {
            const id = String(raw.role_id ?? raw.id ?? "").trim();
            const name = String(raw.role_name ?? raw.name ?? "Unknown");
            const t4Dead = Number(raw.t4_dead_num ?? 0) || 0;
            const t5Dead = Number(raw.t5_dead_num ?? 0) || 0;
            const t4Heal = Number(raw.t4_heal_num ?? 0) || 0;
            const t5Heal = Number(raw.t5_heal_num ?? 0) || 0;

            return {
                ...raw,
                id,
                name,
                rank: Number(raw.rank) || 0,
                current_power: Number(raw.power ?? raw.current_power) || 0,
                max_power: Number(raw.power_highest ?? raw.max_power) || 0,
                merits: Number(raw.pvpmoney_num ?? raw.merits) || 0,
                enemy_merits: Number(raw.enemy_pvpmoney ?? raw.enemy_merits) || 0,
                gathering: Number(raw.gather_num ?? raw.gathering) || 0,
                deaths_t4_t5: raw.deaths_t4_t5 !== undefined
                    ? (Number(raw.deaths_t4_t5) || 0)
                    : t4Dead + t5Dead,
                healing_t4_t5: raw.healing_t4_t5 !== undefined
                    ? (Number(raw.healing_t4_t5) || 0)
                    : t4Heal + t5Heal,
                t4_dead_num: t4Dead,
                t5_dead_num: t5Dead,
                t4_heal_num: t4Heal,
                t5_heal_num: t5Heal,
                t4_bad_hurt: Number(raw.t4_bad_hurt) || 0,
                t5_bad_hurt: Number(raw.t5_bad_hurt) || 0,
                kill_num: Number(raw.kill_num) || 0,
                dead_num: Number(raw.dead_num) || 0,
                heal_num: Number(raw.heal_num) || 0,
                infantry_kills: Number(raw.infantry_kills) || 0,
                cavalry_kills: Number(raw.cavalry_kills) || 0,
                archers_kills: Number(raw.archers_kills) || 0,
                mage_kills: Number(raw.mage_kills) || 0,
                other_merits: Number(raw.other_merits) || 0
            };
        }

        function normalizeDayData(data) {
            if (!data || !Array.isArray(data.players)) return data;
            return {
                ...data,
                players: data.players.map(normalizePlayer)
            };
        }

        async function initDateSelectors() {
            try {
                const res = await fetch("../../data/days/list.json", {
                    cache: "no-store"
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const rawList = await res.json();
                if (!Array.isArray(rawList)) {
                    throw new Error("data/list.json must contain an array");
                }

                rawDateMap = {};
                rawList.forEach(item => {
                    const rawName = String(item).replace(/\.json$/i, "").trim();
                    const normalized = normalizeDate(rawName);
                    if (normalized) rawDateMap[normalized] = rawName;
                });

                availableDates = Object.keys(rawDateMap).sort(
                    (a, b) => dateToObject(a) - dateToObject(b)
                );
            } catch (error) {
                console.error("Failed to load data/list.json:", error);
                document.getElementById("tableBody").innerHTML = `
                    <div class="p-8 text-center text-red-400">
                        Failed to load date list.
                        <div class="text-xs mt-2 text-red-300">${error.message}</div>
                    </div>`;
                return;
            }

            if (!availableDates.length) {
                document.getElementById("tableBody").innerHTML = `
                    <div class="p-8 text-center theme-text-muted">No date data available</div>`;
                return;
            }

            selectedLatestDate = availableDates[availableDates.length - 1];
            document.getElementById("latestDate").innerText = selectedLatestDate;
        }

        async function loadData() {

            await initDateSelectors();

            if (!selectedLatestDate) {
                return;
            }

            try {

                allDailyData = {};

                for (
                    const normalizedDate
                    of availableDates
                ) {

                    const rawFileName =
                        rawDateMap[normalizedDate];

                    const cleanFileName =
                        String(rawFileName)
                            .replace(/\.json$/i, "")
                            .trim();

                    const url =
                        `../../data/days/${cleanFileName}.json`;

                    try {

                        const res =
                            await fetch(
                                url,
                                {
                                    cache:
                                        "no-store"
                                }
                            );

                        if (!res.ok) {

                            console.error(
                                `Failed to load ${url}: HTTP ${res.status}`
                            );

                            continue;
                        }

                        const data =
                            await res.json();

                        if (
                            data &&
                            Array.isArray(
                                data.players
                            )
                        ) {

                            allDailyData[
                                normalizedDate
                            ] = normalizeDayData(data);

                        }

                    } catch (error) {

                        console.error(
                            "Failed loading:",
                            url,
                            error
                        );

                    }

                }

                processData();

            } catch (error) {

                console.error(
                    "Failed to load data:",
                    error
                );

                document.getElementById(
                    "tableBody"
                ).innerHTML = `

                    <div
                        class="
                            p-8
                            text-center
                            text-red-400
                        "
                    >

                        Failed to load data.

                        <div
                            class="
                                text-xs
                                mt-2
                                text-red-300
                            "
                        >
                            ${error.message}
                        </div>

                    </div>

                `;

            }

        }


        function processData() {

            if (!selectedLatestDate) {
                return;
            }

            const latestData =
                allDailyData[
                    selectedLatestDate
                ];

            if (
                !latestData ||
                !Array.isArray(
                    latestData.players
                )
            ) {

                document.getElementById(
                    "tableBody"
                ).innerHTML = `

                    <div
                        class="
                            p-8
                            text-center
                            text-red-400
                        "
                    >

                        No player data found for
                        ${selectedLatestDate}

                    </div>

                `;

                return;

            }

            const playerMap = {};


            latestData.players.forEach(p => {

                const id =
                    String(
                        p.id ?? ""
                    ).trim();

                if (!id) {
                    return;
                }

                playerMap[id] = {

                    id: id,

                    name:
                        p.name ||
                        "Unknown",

                    rank:
                        Number(p.rank) || 0,

                    current_power:
                        Number(
                            p.current_power
                        ) || 0,

                    merits: 0

                };

            });


            availableDates.forEach(date => {

                const dayData =
                    allDailyData[date];

                if (
                    !dayData ||
                    !Array.isArray(
                        dayData.players
                    )
                ) {
                    return;
                }

                dayData.players.forEach(p => {

                    const id =
                        String(
                            p.id ?? ""
                        ).trim();

                    if (!id) {
                        return;
                    }

                    if (!playerMap[id]) {
                        return;
                    }

                    playerMap[id].merits +=
                        Number(
                            p.merits
                        ) || 0;

                });

            });


            players =
                Object.values(
                    playerMap
                );


            players.forEach(p => {

                p.kpi =
                    p.current_power *
                    0.15;

                if (p.kpi > 0) {

                    p.progress =
                        (
                            p.merits /
                            p.kpi
                        ) * 100;

                } else {

                    p.progress = 0;

                }

                p.progress =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            p.progress
                        )
                    );

                p.kpiReached =
                    p.merits >= p.kpi;

            });


            players.sort(
                (a, b) =>
                    b.merits -
                    a.merits
            );


            players.forEach(
                (p, index) => {

                    p.baseRank =
                        index + 1;

                }
            );


            filteredPlayers =
                [...players];


            updateStats();

            handleSearch();

        }


        function updateStats() {

            const totalMembers =
                players.length;

            const reached =
                players.filter(
                    p => p.kpiReached
                ).length;

            const notReached =
                totalMembers -
                reached;


            document.getElementById(
                "members"
            ).innerText =
                totalMembers;


            const goodPercent =
                totalMembers > 0
                    ? (
                        reached /
                        totalMembers
                    ) * 100
                    : 0;


            const badPercent =
                totalMembers > 0
                    ? (
                        notReached /
                        totalMembers
                    ) * 100
                    : 0;


            document.getElementById(
                "goodStatusBar"
            ).style.width =
                `${goodPercent}%`;


            document.getElementById(
                "badStatusBar"
            ).style.width =
                `${badPercent}%`;


            document.getElementById(
                "goodStatusCount"
            ).innerText =
                `${reached} / ${totalMembers}`;


            document.getElementById(
                "badStatusCount"
            ).innerText =
                `${notReached} / ${totalMembers}`;

        }


        function handleSearch() {

            const query =
                document.getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


            filteredPlayers =
                players.filter(p => {

                    return (
                        p.name
                            .toLowerCase()
                            .includes(query)

                        ||

                        p.id
                            .toLowerCase()
                            .includes(query)
                    );

                });


            render();

        }


        function render() {

            const tbody =
                document.getElementById(
                    "tableBody"
                );

            tbody.innerHTML = "";


            if (!filteredPlayers.length) {

                tbody.innerHTML = `

                    <div
                        class="
                            p-8
                            text-center
                            theme-text-muted
                        "
                    >
                        No matching players
                    </div>

                `;

                return;

            }


            filteredPlayers.forEach(p => {

                const isSpecial =
                    p.id === "22973482";


                let nameClass =
                    isSpecial
                        ? "special-player-name"
                        : "theme-text-primary font-medium";


                let rowClass = "";


                let rankBadge = `

                    <span
                        class="
                            theme-text-secondary
                            font-mono
                        "
                    >
                        ${p.baseRank}
                    </span>

                `;


                if (p.baseRank === 1) {

                    nameClass =
                        isSpecial
                            ? nameClass
                            : "top1-name";

                    rowClass =
                        "glow-row";

                    rankBadge = `

                        <span
                            class="
                                rank-badge-text
                                bg-red-500/20
                                text-red-400
                                border
                                border-red-500/40
                                px-1
                                py-0.5
                                rounded
                                font-extrabold
                            "
                        >
                            1
                        </span>

                    `;

                }


                else if (
                    p.baseRank === 2
                ) {

                    nameClass =
                        isSpecial
                            ? nameClass
                            : "top2-name";

                    rowClass =
                        "glow-row";

                    rankBadge = `

                        <span
                            class="
                                rank-badge-text
                                bg-amber-500/20
                                text-amber-500
                                border
                                border-amber-500/40
                                px-1
                                py-0.5
                                rounded
                                font-bold
                            "
                        >
                            2
                        </span>

                    `;

                }


                else if (
                    p.baseRank === 3
                ) {

                    nameClass =
                        isSpecial
                            ? nameClass
                            : "top3-name";

                    rowClass =
                        "glow-row";

                    rankBadge = `

                        <span
                            class="
                                rank-badge-text
                                bg-purple-500/20
                                text-purple-500
                                border
                                border-purple-500/40
                                px-1
                                py-0.5
                                rounded
                                font-bold
                            "
                        >
                            3
                        </span>

                    `;

                }


                else if (
                    p.baseRank === 4
                ) {

                    nameClass =
                        isSpecial
                            ? nameClass
                            : "top4-name";

                    rowClass =
                        "glow-row";

                    rankBadge = `

                        <span
                            class="
                                rank-badge-text
                                bg-blue-500/20
                                text-blue-400
                                border
                                border-blue-500/40
                                px-1
                                py-0.5
                                rounded
                                font-bold
                            "
                        >
                            4
                        </span>

                    `;

                }


                const progress =
                    Number(
                        p.progress
                    ).toFixed(1);


                const kpiClass =
                    p.kpiReached
                        ? "kpi-good"
                        : "kpi-bad";


                const kpiText =
                    formatKPI(
                        p.kpi
                    );


                const powerText =
                    formatPower(
                        p.current_power
                    );


                tbody.innerHTML += `

                    <div
                        class="
                            ${rowClass}
                        "
                    >

                        <div
                            class="
                                grid-layout
                                row-border
                                data-row
                                w-full
                            "
                        >

                            <div
                                class="
                                    text-left
                                    font-mono
                                    id-text
                                    theme-text-secondary
                                    truncate
                                    pr-1
                                "
                                title="${p.id}"
                            >
                                ${p.id}
                            </div>


                            <div
                                class="
                                    text-center
                                    font-mono
                                "
                            >

                                ${rankBadge}

                            </div>


                            <div
                                class="
                                    text-left
                                    truncate
                                    pl-2
                                    ${nameClass}
                                    notranslate
                                "
                                translate="no"
                                title="${p.name}"
                            >
                                ${p.name}
                            </div>


                            <div
                                class="
                                    text-right
                                    font-mono
                                    font-bold
                                    theme-text-primary
                                    truncate
                                "
                                title="${formatNumber(
                                    p.current_power
                                )}"
                            >
                                ${powerText}
                            </div>


                            <div
                                class="
                                    text-right
                                    font-mono
                                    font-bold
                                    theme-text-primary
                                    truncate
                                "
                                title="${formatNumber(
                                    p.merits
                                )}"
                            >
                                ${formatNumber(
                                    p.merits
                                )}
                            </div>


                            <div
                                class="
                                    progress-kpi-row
                                "
                            >

                                <span
                                    class="
                                        theme-accent-text
                                        font-mono
                                        percent-text
                                        font-semibold
                                        shrink-0
                                    "
                                >
                                    ${progress}%
                                </span>


                                <div
                                    class="
                                        progress-track
                                        rounded-full
                                        overflow-hidden
                                        shrink-0
                                        w-14
                                        sm:w-20
                                    "
                                    title="${progress}%"
                                >

                                    <div
                                        class="progress-fill"
                                        style="
                                            width:${progress}%
                                        "
                                    ></div>

                                </div>


                                <span
                                    class="
                                        font-mono
                                        font-bold
                                        kpi-value
                                        ${kpiClass}
                                    "
                                    title="KPI: ${formatNumber(
                                        p.kpi
                                    )}"
                                >
                                    ${kpiText}
                                </span>

                            </div>

                        </div>

                    </div>

                `;

            });

        }



        function exportCSV() {
            if (!filteredPlayers.length) {
                return;
            }

            const headers = [
                "ID",
                "Rank",
                "Player",
                "Power",
                "Merits",
                "Progress %",
                "KPI",
                "KPI Status"
            ];

            const escapeCSV = value => {
                return `"${String(value ?? "").replace(/"/g, '""')}"`;
            };

            const rows = filteredPlayers.map(p => [
                p.id,
                p.baseRank,
                p.name,
                p.current_power,
                p.merits,
                Number(p.progress || 0).toFixed(1),
                p.kpi,
                p.kpiReached ? "Achieved" : "Not Achieved"
            ].map(escapeCSV).join(","));

            const csv = [
                headers.map(escapeCSV).join(","),
                ...rows
            ].join("\r\n");

            const blob = new Blob(["\uFEFF" + csv], {
                type: "text/csv;charset=utf-8;"
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const date = selectedLatestDate || "latest";

            link.href = url;
            link.download = `nmc_kpi_${date}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        function sortData(type) {

            if (
                currentSortType === type
            ) {

                sortDirection *= -1;

            } else {

                currentSortType = type;

                sortDirection = 1;

            }

            if (type === "rank") {

                filteredPlayers.sort(
                    (a, b) =>
                        sortDirection *
                        (
                            a.baseRank -
                            b.baseRank
                        )
                );

            } else if (type === "merits") {

                filteredPlayers.sort(
                    (a, b) =>
                        sortDirection *
                        (
                            b.merits -
                            a.merits
                        )
                );

            } else if (type === "progress") {

                filteredPlayers.sort(
                    (a, b) =>
                        sortDirection *
                        (
                            b.progress -
                            a.progress
                        )
                );

            }

            [
                "rank",
                "merits",
                "progress"
            ].forEach(column => {

                const btn =
                    document.getElementById(
                        `btn-${column}`
                    );

                const arrow =
                    document.getElementById(
                        `arrow-${column}`
                    );

                if (btn) {
                    btn.classList.toggle(
                        "active",
                        column === type
                    );
                }

                if (arrow) {
                    arrow.innerText =
                        column === type
                            ? (sortDirection === 1 ? "▼" : "▲")
                            : "▼";
                }

            });

            render();

        }


        const tableBody =
            document.getElementById(
                "tableBody"
            );


        if (tableBody) {

            tableBody.addEventListener(
                "touchstart",
                e => {

                    const row =
                        e.target.closest(
                            ".glow-row"
                        );

                    if (!row) {
                        return;
                    }

                    if (
                        activeTouchRow &&
                        activeTouchRow !== row
                    ) {

                        activeTouchRow
                            .classList
                            .remove(
                                "touch-active"
                            );

                    }

                    row.classList.add(
                        "touch-active"
                    );

                    activeTouchRow = row;

                },
                {
                    passive: true
                }
            );

        }


        const sentinel =
            document.getElementById(
                "sticky-sentinel"
            );

        const tableHeader =
            document.getElementById(
                "tableHeader"
            );


        if (
            sentinel &&
            tableHeader
        ) {

            new IntersectionObserver(
                ([entry]) => {

                    tableHeader.classList.toggle(
                        "is-stuck",
                        !entry.isIntersecting
                    );

                },
                {
                    threshold: [0]
                }
            ).observe(sentinel);

        }


        loadData();

    </script>
