<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NMC Home</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --hair-1: #d88bb5;
            --hair-2: #c52f82;
            --hair-3: #63304f;
            --hair-4: #e86645;
            --hair-5: #c92720;

            --bg: #0b0a0f;
            --header: #121017;
            --panel: #15131a;
            --panel-hover: #1b1821;
            --border: #302c35;
            --border-hover: #514954;

            --text: #eeeaf0;
            --muted: #9d98a5;
            --muted-dark: #6f6a75;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(216, 139, 181, 0.13) 0%,
                    rgba(197, 47, 130, 0.10) 25%,
                    rgba(99, 48, 79, 0.11) 50%,
                    rgba(232, 102, 69, 0.09) 75%,
                    rgba(201, 39, 32, 0.11) 100%
                ),
                var(--bg);
        }

        header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            background: rgba(18, 16, 23, 0.94);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-bottom: 1px solid var(--border);

            position: relative;
            z-index: 10;
        }

        header::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: -1px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent 3%,
                    var(--hair-1),
                    var(--hair-2),
                    var(--hair-3),
                    var(--hair-4),
                    var(--hair-5),
                    transparent 97%
                );

            opacity: 0.5;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;

            background:
                linear-gradient(
                    90deg,
                    var(--hair-1),
                    var(--hair-2),
                    var(--hair-3),
                    var(--hair-4),
                    var(--hair-5)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            text-decoration: none;
            color: var(--muted);

            padding: 10px 16px;

            border-radius: 8px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }

        nav a:hover {
            background: #211d26;
            color: #ffffff;
        }

        nav a.active {
            background: #211a24;
            color: #ffffff;

            box-shadow:
                inset 0 0 0 1px rgba(197, 47, 130, 0.25);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 30px;
        }

        .hero {
            text-align: center;
            margin-bottom: 55px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;

            background:
                linear-gradient(
                    90deg,
                    var(--hair-1),
                    var(--hair-2),
                    var(--hair-3),
                    var(--hair-4),
                    var(--hair-5)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            letter-spacing: -1px;
        }

        .hero p {
            color: var(--muted);
            font-size: 18px;
        }

        .hair-colors {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 12px;
            margin-top: 28px;
        }

        .hair-color {
            width: 14px;
            height: 14px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,.25);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .hair-color:hover {
            transform: scale(1.4);
        }

        .hair-color:nth-child(1) {
            background: var(--hair-1);
            box-shadow: 0 0 10px rgba(216,139,181,.4);
        }

        .hair-color:nth-child(2) {
            background: var(--hair-2);
            box-shadow: 0 0 10px rgba(197,47,130,.4);
        }

        .hair-color:nth-child(3) {
            background: var(--hair-3);
            box-shadow: 0 0 10px rgba(99,48,79,.45);
        }

        .hair-color:nth-child(4) {
            background: var(--hair-4);
            box-shadow: 0 0 10px rgba(232,102,69,.4);
        }

        .hair-color:nth-child(5) {
            background: var(--hair-5);
            box-shadow: 0 0 10px rgba(201,39,32,.4);
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 20px;
        }

        .card {
            height: 240px;

            display: block;

            text-decoration: none;
            color: inherit;

            background: rgba(21,19,26,.88);

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 28px;

            position: relative;
            overflow: hidden;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;
            right: 15%;

            height: 1px;

            opacity: .45;

            transition: opacity .2s ease;
        }

        .card:hover {
            transform: translateY(-4px);

            background: rgba(27,24,33,.94);

            border-color: var(--border-hover);

            box-shadow:
                0 10px 28px rgba(0,0,0,.35);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:nth-child(1)::before {
            background: var(--hair-1);
        }

        .card:nth-child(2)::before {
            background: var(--hair-2);
        }

        .card:nth-child(3)::before {
            background: var(--hair-3);
        }

        .card:nth-child(4)::before {
            background: var(--hair-4);
        }

        .card:nth-child(5)::before {
            background: var(--hair-5);
        }

        .card h2 {
            font-size: 20px;
            line-height: 1.25;
            margin: 0;
        }

        .card-icon {
            width: 48px;
            height: 48px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            vertical-align: middle;

            margin-right: 14px;

            border-radius: 50%;

            background: #211e26;

            font-size: 23px;

            border: 1px solid var(--border);

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.05);
        }

        .card:nth-child(1):hover .card-icon {
            border-color: var(--hair-1);
            box-shadow: 0 0 13px rgba(216,139,181,.2);
        }

        .card:nth-child(2):hover .card-icon {
            border-color: var(--hair-2);
            box-shadow: 0 0 13px rgba(197,47,130,.2);
        }

        .card:nth-child(3):hover .card-icon {
            border-color: var(--hair-3);
            box-shadow: 0 0 13px rgba(99,48,79,.25);
        }

        .card:nth-child(4):hover .card-icon {
            border-color: var(--hair-4);
            box-shadow: 0 0 13px rgba(232,102,69,.2);
        }

        .card:nth-child(5):hover .card-icon {
            border-color: var(--hair-5);
            box-shadow: 0 0 13px rgba(201,39,32,.2);
        }

        .card p {
            color: var(--muted);

            line-height: 1.5;

            font-size: 14px;

            margin-top: 12px;
        }

        @media(max-width:600px) {

            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            main {
                padding: 45px 20px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hair-colors {
                gap: 9px;
            }

            .hair-color {
                width: 11px;
                height: 11px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                height: 240px;
            }

            .card h2 {
                font-size: 19px;
            }

            .card-icon {
                width: 42px;
                height: 42px;
                font-size: 20px;
                margin-right: 10px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        >NMC Home
    </div>

<main>

    <section class="hero">

        <div class="hair-colors">

    <section class="cards">

        <a

        <a class="card"

        <a class="card"

</body>
</html>
