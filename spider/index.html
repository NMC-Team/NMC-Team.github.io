<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Chart — NMC Alliance Hub</title>
    <meta name="description" content="Radar comparison of combat attributes for No Mercy alliance members.">
    <meta name="theme-color" content="#080a0f">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main">
        <div class="page-header">
            <div class="page-title-group">
                <h1 class="page-title">Combat Archetype Radar</h1>
                <span class="module-badge ">Spider Comparison</span>
            </div>
            <p class="page-desc">Compare two members (or a member against the tracked average) across offense, survivability, rally readiness, merit generation, mobility, and activity.</p>
        </div>
        <noscript><div class="state-box"><strong>JavaScript is required</strong>This dashboard loads its data in the browser.</div></noscript>

        <div id="issues"></div>

        <div id="spiderApp" hidden>
            <div class="selector-card">
                <div class="select-field">
                    <label class="select-label" for="p1Select"><span class="dot" style="background: var(--accent-cyan);"></span>Primary Target (Player 1)</label>
                    <select id="p1Select" class="select-input"></select>
                </div>
                <div class="select-field">
                    <label class="select-label" for="p2Select"><span class="dot" style="background: var(--accent-gold);"></span>Benchmark Target (Player 2)</label>
                    <select id="p2Select" class="select-input"></select>
                </div>
            </div>

            <div class="radar-layout">
                <section class="panel" aria-labelledby="radarTitle">
                    <h2 class="panel-title" id="radarTitle"><span>Hexagonal Radar Matrix</span><span class="panel-note">Normalized (0 – 100)</span></h2>
                    <div class="radar-container">
                        <svg class="radar-svg" viewBox="0 0 440 440" id="radarSvg" role="img" aria-label="Radar chart comparing the two selected members"></svg>
                    </div>
                </section>
                <section class="panel" aria-labelledby="breakdownTitle">
                    <h2 class="panel-title" id="breakdownTitle"><span>Attribute Breakdown</span><span class="panel-note" id="diffLabel"></span></h2>
                    <div class="stat-list" id="statBarsContainer"></div>
                </section>
            </div>
        </div>
        <div id="spiderEmpty"></div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="../assets/js/spider.js"></script>
</body>
</html>
