<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — NMC Alliance Hub</title>
    <meta name="theme-color" content="#080a0f">
    <!-- Self-contained on purpose: GitHub Pages serves this file from any URL depth,
         so relative paths to /assets would break. -->
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080a0f; color: #f3f4f6;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
        h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.5px; }
        p { color: #9ca3af; margin: 0 0 24px; }
        a { display: inline-block; color: #6366f1; text-decoration: none; font-weight: 600; padding: 10px 18px;
            border: 1px solid rgba(99, 102, 241, .35); background: rgba(99, 102, 241, .1); border-radius: 8px; }
        a:hover { background: #6366f1; color: #fff; }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>That address doesn't exist on the Alliance Hub.</p>
        <a id="home" href="/">Back to the hub</a>
    </main>
    <script>
        // Project sites live at username.github.io/<repo>/, so link back to /<repo>/.
        // If this repo is named <username>.github.io (a "user site"), set USER_SITE = true.
        var USER_SITE = false;
        var parts = location.pathname.split('/').filter(Boolean);
        if (!USER_SITE && location.hostname.slice(-10) === '.github.io' && parts.length) {
            document.getElementById('home').href = '/' + parts[0] + '/';
        }
    </script>
</body>
</html>
